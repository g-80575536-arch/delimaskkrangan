<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELIMa SK Krangan</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px 10px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .logo {
            max-width: 100px;
            height: auto;
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .search-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .search-group input[type="text"] {
            margin-bottom: 0;
        }
        .search-btn {
            padding: 14px 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }
        .search-btn:hover {
            background-color: #e68900;
        }
        .result-box {
            display: none;
            background: #e9f5e9;
            border-left: 5px solid #28a745;
            padding: 15px;
            text-align: left;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .result-box p {
            margin: 5px 0;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-copy {
            background-color: #28a745;
        }
        .btn-copy:hover {
            background-color: #218838;
        }
        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
        .copied-msg {
            color: #28a745;
            font-size: 13px;
            margin-top: -5px;
            margin-bottom: 10px;
            display: none;
        }
        .dropdown-box {
            display: none;
            width: 100%;
            padding: 10px;
            margin-top: -10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }
        .dropdown-item {
            padding: 8px;
            cursor: pointer;
        }
        .dropdown-item:hover {
            background-color: #f1f1f1;
        }
        .footer {
            margin-top: 20px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo Sekolah" class="logo">
        
        <h2>DELIMa SK Krangan</h2>
        <p class="subtitle">Sila taip nama dan tekan butang cari</p>

        <div class="search-group">
            <input type="text" id="searchInput" placeholder="Sila taip nama anda..." oninput="filterStudents()">
            <button class="search-btn" onclick="triggerSearch()">Cari</button>
        </div>
        
        <div id="dropdownBox" class="dropdown-box"></div>

        <div id="result" class="result-box">
            <p><strong>Nama:</strong> <span id="studentName"></span></p>
            <p><strong>E-mel:</strong> <span id="studentEmail"></span></p>
            <p><strong>Tahun:</strong> <span id="studentYear"></span></p>
            <br>
            
            <input type="password" id="studentPassword" placeholder="Masukkan kata laluan">
            <p id="errorMsg" class="error-msg">Kata laluan tidak sah.</p>
            
            <button class="btn-copy" onclick="copyEmail()">1. Salin E-mel Sahaja</button>
            <p id="copiedEmailMsg" class="copied-msg">E-mel berjaya disalin ke papan keratan!</p>
            
            <button class="btn-copy" onclick="copyPassword()">2. Salin Kata Laluan Sahaja</button>
            <p id="copiedPasswordMsg" class="copied-msg">Kata laluan berjaya disalin ke papan keratan!</p>
            
            <button onclick="goToAins()">3. Pergi ke Laman AINS</button>
        </div>
    </div>

    <div class="footer">
        Hak Cipta Terpelihara &copy; 2026 | Disediakan oleh <b>UNIT ICT SK KRANGAN</b>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsRIFl8EOmO_RfQbifRYv0A7P6e5tOabWf4Qzhp50g9YBkQYCqU9F_zkX873yD9BVDJA/exec";
        
        let students = [];
        let selectedStudent = null;

        async function fetchStudentsData() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                students = await response.json();
                console.log("Data murid berjaya dimuatkan.");
            } catch (error) {
                console.error("Ralat memuatkan data:", error);
            }
        }

        fetchStudentsData();

        function filterStudents() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            const dropdownBox = document.getElementById('dropdownBox');
            
            document.getElementById('result').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('copiedEmailMsg').style.display = 'none';
            document.getElementById('copiedPasswordMsg').style.display = 'none';

            if (input.length > 2) {
                const filtered = students.filter(s => s.name && s.name.toLowerCase().includes(input));

                if (filtered.length > 0) {
                    let html = '';
                    filtered.forEach(s => {
                        html += `<div class="dropdown-item" onclick="selectStudent('${s.name}')">${s.name}</div>`;
                    });
                    dropdownBox.innerHTML = html;
                    dropdownBox.style.display = 'block';
                } else {
                    dropdownBox.style.display = 'none';
                }
            } else {
                dropdownBox.style.display = 'none';
            }
        }

        // Fungsi apabila butang Cari ditekan
        function triggerSearch() {
            const input = document.getElementById('searchInput').value.trim();
            const found = students.find(s => s.name && s.name.toLowerCase() === input.toLowerCase());
            
            if (found) {
                selectStudent(found.name);
            } else {
                // Jika tiada dalam senarai atau tidak dipilih dari dropdown
                alert("Murid tidak dijumpai. Sila pastikan ejaan betul atau pilih dari senarai cadangan.");
            }
        }

        function selectStudent(name) {
            const found = students.find(s => s.name === name);
            if (found) {
                selectedStudent = found;
                
                document.getElementById('searchInput').value = found.name;
                document.getElementById('dropdownBox').style.display = 'none';
                
                document.getElementById('studentName').innerText = found.name;
                document.getElementById('studentEmail').innerText = found.email;
                document.getElementById('studentYear').innerText = found.year;
                
                document.getElementById('result').style.display = 'block';
            }
        }

        function copyEmail() {
            if (selectedStudent) {
                const enteredPassword = document.getElementById('studentPassword').value.trim();
                
                if (enteredPassword === selectedStudent.password.toString()) {
                    navigator.clipboard.writeText(selectedStudent.email).then(() => {
                        document.getElementById('copiedEmailMsg').style.display = 'block';
                        document.getElementById('copiedPasswordMsg').style.display = 'none';
                    });
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }
        }

        function copyPassword() {
            if (selectedStudent) {
                const enteredPassword = document.getElementById('studentPassword').value.trim();
                
                if (enteredPassword === selectedStudent.password.toString()) {
                    navigator.clipboard.writeText(selectedStudent.password).then(() => {
                        document.getElementById('copiedPasswordMsg').style.display = 'block';
                        document.getElementById('copiedEmailMsg').style.display = 'none';
                    });
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }
        }

        function goToAins() {
            const ainsUrl = "https://ains.moe.gov.my";
            window.open(ainsUrl, '_blank');
        }
    </script>
</body>
</html>
